services:
  - type: web
    name: level-up-interview-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PASS_THRESHOLD
        value: "70"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
